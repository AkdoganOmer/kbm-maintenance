<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - KBM Bakım Sistemi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Debug Sayfası</h1>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5>Session Storage Bilgileri</h5>
            </div>
            <div class="card-body">
                <div id="sessionInfo"></div>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5>Test İşlemleri</h5>
            </div>
            <div class="card-body">
                <button class="btn btn-primary" onclick="testLogin()">Test Giriş</button>
                <button class="btn btn-warning" onclick="clearSession()">Session Temizle</button>
                <button class="btn btn-info" onclick="checkAuth()">Auth Kontrol</button>
                <button class="btn btn-success" onclick="goToTimesheet()">Puantaja Git</button>
            </div>
        </div>
        
        <div class="card mt-4">
            <div class="card-header">
                <h5>Console Logları</h5>
            </div>
            <div class="card-body">
                <div id="consoleLog" style="background: #f8f9fa; padding: 10px; font-family: monospace; white-space: pre-wrap; max-height: 300px; overflow-y: auto;"></div>
            </div>
        </div>
    </div>
    
    <script>
        // Console log yakalama
        const consoleDiv = document.getElementById('consoleLog');
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            consoleDiv.innerHTML += 'LOG: ' + args.join(' ') + '\n';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            consoleDiv.innerHTML += 'ERROR: ' + args.join(' ') + '\n';
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        };
        
        // Session bilgilerini göster
        function showSessionInfo() {
            const sessionDiv = document.getElementById('sessionInfo');
            const sessionData = {
                isAuthenticated: sessionStorage.getItem('isAuthenticated'),
                userId: sessionStorage.getItem('userId'),
                userName: sessionStorage.getItem('userName'),
                userRole: sessionStorage.getItem('userRole'),
                currentUser: sessionStorage.getItem('currentUser')
            };
            
            let html = '<table class="table table-striped">';
            for (const [key, value] of Object.entries(sessionData)) {
                html += `<tr><td><strong>${key}:</strong></td><td>${value || 'null'}</td></tr>`;
            }
            html += '</table>';
            
            sessionDiv.innerHTML = html;
            console.log('Session bilgileri:', sessionData);
        }
        
        // Test giriş
        function testLogin() {
            console.log('Test giriş başlatılıyor...');
            
            const testUser = {
                id: 'test1',
                name: 'Test Kullanıcı',
                username: 'test',
                role: 'admin',
                department: 'Test'
            };
            
            sessionStorage.setItem('isAuthenticated', 'true');
            sessionStorage.setItem('userId', testUser.id);
            sessionStorage.setItem('userName', testUser.name);
            sessionStorage.setItem('userRole', testUser.role);
            sessionStorage.setItem('currentUser', JSON.stringify(testUser));
            
            console.log('Test giriş tamamlandı');
            showSessionInfo();
        }
        
        // Session temizle
        function clearSession() {
            sessionStorage.clear();
            console.log('Session temizlendi');
            showSessionInfo();
        }
        
        // Auth kontrol
        function checkAuth() {
            const isAuthenticated = sessionStorage.getItem('isAuthenticated') === 'true';
            const currentUser = sessionStorage.getItem('currentUser');
            const userRole = sessionStorage.getItem('userRole');
            
            console.log('Auth kontrol sonucu:', {
                isAuthenticated,
                hasCurrentUser: !!currentUser,
                userRole
            });
            
            if (isAuthenticated && currentUser && userRole) {
                console.log('✅ Auth başarılı');
            } else {
                console.log('❌ Auth başarısız');
            }
        }
        
        // Puantaja git
        function goToTimesheet() {
            console.log('Puantaj sayfasına yönlendiriliyor...');
            window.location.href = 'timesheet.html';
        }
        
        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Debug sayfası yüklendi');
            showSessionInfo();
        });
    </script>
</body>
</html>

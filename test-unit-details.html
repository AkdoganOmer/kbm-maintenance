<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Ünite Detayları</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="styles.css" rel="stylesheet">

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-building-gear"></i>
                KBMSERGİ
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            <i class="bi bi-house"></i>
                            Ana Sayfa
                        </a>
                    </li>
                </ul>
                <div class="d-flex align-items-center">
                    <div id="userInfo" class="text-light"></div>
                    <button class="btn btn-outline-light ms-3" onclick="logout()">
                        <i class="bi bi-box-arrow-right"></i>
                        Çıkış
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="alert alert-info">
            <h4>Authentication Test</h4>
            <p>Bu sayfa authentication sistemini test etmek için oluşturulmuştur.</p>
            <div id="authStatus"></div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Session Storage Durumu</h5>
                    </div>
                    <div class="card-body">
                        <div id="sessionInfo"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>URL Parametreleri</h5>
                    </div>
                    <div class="card-body">
                        <div id="urlParams"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Debug Log</h5>
                    </div>
                    <div class="card-body">
                        <div id="debugLog" style="font-family: monospace; font-size: 12px; max-height: 300px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Debug log fonksiyonu
        function debugLog(message, data = null) {
            const timestamp = new Date().toISOString();
            const logElement = document.getElementById('debugLog');
            const logEntry = `[${timestamp}] ${message}`;
            
            console.log(logEntry);
            if (data) {
                console.log('Data:', data);
            }
            
            if (logElement) {
                const div = document.createElement('div');
                div.innerHTML = `<strong>${logEntry}</strong>`;
                if (data) {
                    div.innerHTML += `<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                }
                logElement.appendChild(div);
                logElement.scrollTop = logElement.scrollHeight;
            }
        }

        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', function() {
            debugLog('Test sayfası yüklendi');
            
            // Authentication kontrolü
            const isAuthenticated = sessionStorage.getItem('isAuthenticated') === 'true';
            const userData = JSON.parse(sessionStorage.getItem('userData') || '{}');
            
            debugLog('Authentication durumu:', { isAuthenticated, userData });
            
            // Auth status göster
            const authStatus = document.getElementById('authStatus');
            if (isAuthenticated) {
                authStatus.innerHTML = `
                    <div class="alert alert-success">
                        <strong>✅ Kullanıcı oturum açmış</strong><br>
                        Email: ${userData.email}<br>
                        İsim: ${userData.name}<br>
                        Rol: ${userData.role}
                    </div>
                `;
            } else {
                authStatus.innerHTML = `
                    <div class="alert alert-danger">
                        <strong>❌ Kullanıcı oturum açmamış</strong>
                    </div>
                `;
            }
            
            // Session storage göster
            const sessionInfo = document.getElementById('sessionInfo');
            sessionInfo.innerHTML = `
                <p><strong>isAuthenticated:</strong> ${sessionStorage.getItem('isAuthenticated')}</p>
                <p><strong>userData:</strong></p>
                <pre>${sessionStorage.getItem('userData')}</pre>
            `;
            
            // URL parametrelerini göster
            const urlParams = new URLSearchParams(window.location.search);
            const urlParamsDiv = document.getElementById('urlParams');
            urlParamsDiv.innerHTML = `
                <p><strong>galleryId:</strong> ${urlParams.get('galleryId')}</p>
                <p><strong>unitId:</strong> ${urlParams.get('unitId')}</p>
            `;
            
            // User info güncelle
            updateUserInfo(userData);
            
            debugLog('Test tamamlandı');
        });

        // Kullanıcı bilgilerini güncelle
        function updateUserInfo(userData) {
            const userInfoElement = document.getElementById('userInfo');
            if (userInfoElement && userData && userData.name) {
                const roleText = getRoleText(userData.role);
                userInfoElement.innerHTML = `
                    <span class="me-2">
                        <i class="bi bi-person-circle me-1"></i>
                        ${userData.name || 'Kullanıcı'}
                    </span>
                    <small class="text-light opacity-75">(${roleText})</small>
                `;
            }
        }

        // Rol metni al
        function getRoleText(role) {
            const roleMap = {
                'admin': 'Yönetici',
                'manager': 'Müdür', 
                'technician': 'Teknisyen',
                'staff': 'Personel'
            };
            return roleMap[role] || 'Kullanıcı';
        }

        // Çıkış fonksiyonu
        function logout() {
            sessionStorage.removeItem('isAuthenticated');
            sessionStorage.removeItem('userData');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
